<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <link rel="stylesheet" href="style.css" />
    <meta name="theme-color" content="#0e0f12" />
    <title>Study Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div
      id="hub"
      class="hb"
      role="dialog"
      aria-modal="true"
      aria-label="Study Lab"
      hidden
    ></div>
    <template id="tk-tpl"
      ><style>
        :host {
          display: block;
        }
        * {
          box-sizing: border-box;
          margin: 0;
        }
        .root {
          --s1: #1c1c1e;
          --s2: #2c2c2e;
          --line: rgba(255, 255, 255, 0.08);
          --ink: #f5f5f7;
          --mut: #98989d;
          --dim: #636366;
          --acc: #ff9f0a;
          --acc2: #ffc247;
          --ar: 255, 159, 10;
          --r: 28px;
          position: absolute;
          inset: 0;
          color: var(--ink);
          font:
            500 14px/1.4 -apple-system,
            BlinkMacSystemFont,
            "SF Pro Display",
            "SF Pro Text",
            Inter,
            "Helvetica Neue",
            system-ui,
            sans-serif;
          letter-spacing: -0.011em;
          background:
            radial-gradient(
              900px 520px at 88% -12%,
              rgba(var(--ar), 0.11),
              transparent 62%
            ),
            radial-gradient(
              700px 500px at -5% 110%,
              rgba(10, 132, 255, 0.07),
              transparent 60%
            ),
            #000;
          overflow: hidden;
          -webkit-font-smoothing: antialiased;
        }
        .root[data-t="ocean"] {
          --acc: #0a84ff;
          --acc2: #64d2ff;
          --ar: 10, 132, 255;
        }
        .root[data-t="purple"] {
          --acc: #bf5af2;
          --acc2: #e9a8ff;
          --ar: 191, 90, 242;
        }
        .root[data-t="emerald"] {
          --acc: #30d158;
          --acc2: #8ef0a6;
          --ar: 48, 209, 88;
        }
        .root[data-t="rose"] {
          --acc: #ff6482;
          --acc2: #ffb199;
          --ar: 255, 100, 130;
        }
        button {
          font: inherit;
          color: inherit;
          background: none;
          border: 0;
          cursor: pointer;
          transition:
            transform 0.18s cubic-bezier(0.3, 1.5, 0.5, 1),
            background 0.3s,
            color 0.25s,
            box-shadow 0.3s,
            border-color 0.3s,
            opacity 0.3s;
        }
        button:not(:disabled):active {
          transform: scale(0.95) !important;
        }
        input {
          font: inherit;
        }
        .app {
          display: grid;
          grid-template-columns: 250px 1fr;
          height: 100%;
        }
        .side {
          padding: 30px 16px 20px;
          border-right: 1px solid var(--line);
          display: flex;
          flex-direction: column;
          gap: 6px;
        }
        .logo {
          font-size: 11px;
          letter-spacing: 0.34em;
          color: var(--mut);
          font-weight: 700;
          padding: 0 14px 22px;
          display: flex;
          align-items: center;
          gap: 10px;
        }
        .logo::before {
          content: "";
          width: 8px;
          height: 8px;
          border-radius: 50%;
          background: var(--acc);
          box-shadow: 0 0 12px var(--acc);
        }
        .nav {
          position: relative;
          isolation: isolate;
          display: flex;
          align-items: center;
          gap: 12px;
          padding: 13px 16px;
          border-radius: 999px;
          color: var(--mut);
          font-weight: 600;
          font-size: 15px;
          border: 1px solid transparent;
          text-align: left;
        }
        .nav svg {
          width: 20px;
          height: 20px;
          stroke: currentColor;
          fill: none;
          stroke-width: 1.8;
          stroke-linecap: round;
          stroke-linejoin: round;
          transition:
            transform 0.35s cubic-bezier(0.3, 1.6, 0.5, 1),
            filter 0.3s;
        }
        .nav:hover {
          color: var(--ink);
          background: rgba(255, 255, 255, 0.04);
        }
        .nav:hover svg {
          transform: scale(1.15) rotate(-6deg);
        }
        .nav.on {
          color: var(--ink);
          background: rgba(var(--ar), 0.08);
          border-color: rgba(var(--ar), 0.3);
        }
        .nav.on::before {
          content: "";
          position: absolute;
          left: 4px;
          top: 50%;
          width: 54px;
          height: 54px;
          transform: translateY(-50%);
          background: radial-gradient(
            closest-side,
            rgba(var(--ar), 0.5),
            transparent
          );
          filter: blur(5px);
          z-index: -1;
          animation: glw 3.2s ease-in-out infinite;
        }
        .nav.on svg {
          color: var(--acc);
          filter: drop-shadow(0 0 7px rgba(var(--ar), 0.8));
        }
        @keyframes glw {
          50% {
            opacity: 0.55;
            transform: translateY(-50%) scale(1.15);
          }
        }
        .nav b {
          margin-left: auto;
          font-size: 11px;
          background: rgba(255, 255, 255, 0.1);
          padding: 2px 9px;
          border-radius: 99px;
        }
        .live {
          margin-left: auto;
          width: 7px;
          height: 7px;
          border-radius: 50%;
          background: var(--acc);
          box-shadow: 0 0 10px var(--acc);
          animation: blk 1.6s ease-in-out infinite;
        }
        .live[hidden],
        .nav b[hidden] {
          display: none;
        }
        @keyframes blk {
          50% {
            opacity: 0.3;
          }
        }
        .prof {
          margin-top: auto;
          display: flex;
          align-items: center;
          gap: 12px;
          padding: 12px 14px;
          border-radius: 999px;
          background: rgba(255, 255, 255, 0.04);
          border: 1px solid var(--line);
        }
        .prof small,
        .lvh small {
          display: block;
          color: var(--dim);
          font-size: 11px;
          font-weight: 600;
        }
        .prof b {
          font-size: 13px;
        }
        .av {
          width: 38px;
          height: 38px;
          border-radius: 50%;
          display: grid;
          place-items: center;
          font-size: 19px;
          background: radial-gradient(
            circle at 30% 25%,
            rgba(var(--ar), 0.35),
            rgba(var(--ar), 0.08)
          );
          box-shadow: 0 0 18px -4px rgba(var(--ar), 0.7);
          flex: none;
        }
        .shine {
          background: linear-gradient(
            100deg,
            var(--ink) 20%,
            var(--acc2) 45%,
            var(--acc) 55%,
            var(--ink) 80%
          );
          background-size: 250% 100%;
          -webkit-background-clip: text;
          background-clip: text;
          color: transparent;
          animation: shn 4s linear infinite;
        }
        @keyframes shn {
          to {
            background-position: -250% 0;
          }
        }
        .main {
          overflow: auto;
          padding: 44px clamp(16px, 4.5vw, 64px) 90px;
        }
        .main::-webkit-scrollbar {
          width: 0;
        }
        .wrap {
          max-width: 1180px;
          margin: auto;
        }
        h1 {
          font-size: clamp(30px, 4vw, 42px);
          font-weight: 700;
          letter-spacing: -0.035em;
        }
        h3 {
          font-size: 15px;
          font-weight: 700;
          letter-spacing: -0.01em;
        }
        .sub,
        .cap2 {
          color: var(--mut);
          margin-top: 3px;
          font-size: 13px;
        }
        .view[hidden] {
          display: none;
        }
        .view {
          animation: in 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        @keyframes in {
          from {
            opacity: 0;
            transform: translateY(10px);
          }
        }
        /* cards */
        .card {
          position: relative;
          border-radius: var(--r);
          background: rgba(28, 28, 30, 0.72);
          -webkit-backdrop-filter: blur(10px);
          backdrop-filter: blur(10px);
          box-shadow:
            inset 0 1px 0 rgba(255, 255, 255, 0.05),
            0 22px 50px -32px #000;
          transition: all 0.3s ease;
        }
        .card::before {
          content: "";
          position: absolute;
          inset: 0;
          border-radius: inherit;
          padding: 1px;
          background: linear-gradient(
            180deg,
            rgba(255, 255, 255, 0.16),
            rgba(255, 255, 255, 0) 70%
          );
          -webkit-mask:
            linear-gradient(#000 0 0) content-box,
            linear-gradient(#000 0 0);
          -webkit-mask-composite: xor;
          mask-composite: exclude;
          pointer-events: none;
        }
        @media (hover: hover) {
          .card:hover {
            transform: translateY(-2px);
            background: rgba(38, 38, 41, 0.8);
          }
        }
        .panel {
          padding: 24px 26px;
          margin-top: 18px;
        }
        .pill {
          padding: 8px 18px;
          border-radius: 999px;
          border: 1px solid var(--line);
          color: var(--mut);
          font-weight: 600;
        }
        .pill:hover {
          color: var(--ink);
          background: rgba(255, 255, 255, 0.05);
        }
        .pill.on {
          background: var(--ink);
          color: #000;
          border-color: var(--ink);
          box-shadow: 0 6px 22px -8px rgba(255, 255, 255, 0.5);
        }
        .seg {
          display: flex;
          gap: 8px;
          margin: 20px 0 20px;
          flex-wrap: wrap;
        }
        .pt {
          font-size: 11px;
          letter-spacing: 0.16em;
          font-weight: 700;
          color: var(--mut);
          display: flex;
          gap: 8px;
          align-items: center;
          margin-bottom: 12px;
        }
        .pk {
          padding: 5px 14px;
          border-radius: 999px;
          background: rgba(var(--ar), 0.12);
          color: var(--acc2);
          font-size: 12px;
          font-weight: 700;
          border: 1px solid rgba(var(--ar), 0.25);
        }
        .hh {
          display: flex;
          justify-content: space-between;
          align-items: flex-start;
          gap: 12px;
          margin-bottom: 18px;
        }
        .mn {
          display: flex;
          align-items: center;
          gap: 6px;
          padding: 4px;
          border-radius: 999px;
          background: rgba(255, 255, 255, 0.05);
          border: 1px solid var(--line);
          color: var(--mut);
          font-weight: 700;
          font-size: 11.5px;
          letter-spacing: 0.1em;
          white-space: nowrap;
        }
        .mn span {
          min-width: 92px;
          text-align: center;
        }
        .mn button {
          width: 30px;
          height: 30px;
          border-radius: 50%;
          color: var(--mut);
          font-size: 16px;
        }
        .mn button:hover {
          background: rgba(255, 255, 255, 0.1);
          color: var(--ink);
        }
        .mn button:disabled {
          opacity: 0.3;
          cursor: default;
        }
        /* tasks */
        .add {
          padding: 16px 22px;
          max-width: 780px;
          z-index: 4;
        }
        .add:focus-within {
          box-shadow:
            inset 0 1px 0 rgba(255, 255, 255, 0.06),
            0 0 0 4px rgba(var(--ar), 0.12),
            0 22px 50px -32px #000;
        }
        .row {
          display: flex;
          align-items: center;
          gap: 14px;
        }
        .plus {
          width: 28px;
          height: 28px;
          border-radius: 50%;
          border: 1.5px solid var(--dim);
          display: grid;
          place-items: center;
          color: var(--mut);
          flex: none;
        }
        .add input {
          flex: 1;
          background: none;
          border: 0;
          outline: 0;
          color: var(--ink);
          font-size: 17px;
          font-weight: 600;
          min-width: 0;
        }
        .add input::placeholder {
          color: var(--dim);
        }
        .caps {
          display: flex;
          gap: 8px;
          margin: 12px 0 0 42px;
          position: relative;
          flex-wrap: wrap;
        }
        .cap {
          display: flex;
          align-items: center;
          gap: 7px;
          padding: 7px 14px;
          border-radius: 999px;
          background: rgba(255, 255, 255, 0.05);
          border: 1px solid var(--line);
          font-size: 12px;
          color: var(--mut);
          font-weight: 600;
        }
        .cap:hover {
          color: var(--ink);
          background: rgba(255, 255, 255, 0.09);
        }
        .dot {
          width: 8px;
          height: 8px;
          border-radius: 50%;
          display: inline-block;
          flex: none;
        }
        .pop {
          position: absolute;
          top: calc(100% + 8px);
          left: 0;
          z-index: 30;
          background: rgba(36, 36, 40, 0.94);
          -webkit-backdrop-filter: blur(20px);
          backdrop-filter: blur(20px);
          border: 1px solid var(--line);
          border-radius: 24px;
          padding: 8px;
          min-width: 190px;
          max-height: 340px;
          overflow: auto;
          box-shadow:
            inset 0 1px 0 rgba(255, 255, 255, 0.08),
            0 30px 60px -10px #000;
          display: none;
          transform-origin: top left;
        }
        .caps .pop {
          top: 42px;
        }
        .pop::-webkit-scrollbar {
          width: 0;
        }
        .pop.on {
          display: block;
          animation: popin 0.32s cubic-bezier(0.2, 1.2, 0.4, 1);
        }
        @keyframes popin {
          from {
            opacity: 0;
            transform: scale(0.92) translateY(-6px);
          }
        }
        .pop button {
          display: flex;
          align-items: center;
          gap: 10px;
          width: 100%;
          padding: 10px 14px;
          border-radius: 999px;
          font-size: 13px;
          text-align: left;
          font-weight: 600;
        }
        .pop button:hover {
          background: rgba(255, 255, 255, 0.08);
        }
        .pop .sel {
          background: rgba(var(--ar), 0.16);
          color: var(--acc2);
        }
        .pop button svg {
          flex: none;
          color: var(--mut);
        }
        .pop .cus {
          color: var(--acc2);
        }
        .pop .cus svg {
          color: var(--acc);
        }
        .sep {
          height: 1px;
          background: var(--line);
          margin: 6px 8px;
        }
        .mc {
          width: 252px;
          padding: 4px;
        }
        .mch {
          display: flex;
          align-items: center;
          justify-content: space-between;
          font-weight: 700;
          font-size: 13px;
          padding: 4px 2px 10px;
        }
        .mch button {
          width: 28px !important;
          height: 28px;
          padding: 0 !important;
          justify-content: center;
          border-radius: 50% !important;
        }
        .mcg {
          display: grid;
          grid-template-columns: repeat(7, 1fr);
          gap: 3px;
        }
        .mcg em {
          font-style: normal;
          text-align: center;
          font-size: 10px;
          color: var(--dim);
          font-weight: 700;
          padding-bottom: 4px;
        }
        .mcg button {
          width: auto !important;
          height: 31px;
          padding: 0 !important;
          justify-content: center;
          border-radius: 50% !important;
          font-size: 12px;
        }
        .mcg .t {
          color: var(--acc2);
          box-shadow: inset 0 0 0 1px rgba(var(--ar), 0.5);
        }
        .mcg .s {
          background: linear-gradient(
            135deg,
            var(--acc2),
            var(--acc)
          ) !important;
          color: #1a0e04;
          font-weight: 700;
        }
        .grp {
          margin-top: 28px;
          max-width: 780px;
        }
        .gh {
          display: flex;
          align-items: center;
          gap: 10px;
          font-weight: 700;
          font-size: 16px;
          margin-bottom: 12px;
        }
        .gh i {
          font-style: normal;
          color: var(--dim);
          font-size: 13px;
        }
        .task {
          display: flex;
          gap: 14px;
          align-items: flex-start;
          padding: 14px 18px;
          margin-bottom: 8px;
          border-radius: 24px;
          background: rgba(255, 255, 255, 0.03);
          border: 1px solid var(--line);
          animation: rise 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) both;
          animation-delay: calc(var(--i, 0) * 70ms);
          transition:
            background 0.3s,
            transform 0.3s;
        }
        .task:hover {
          background: rgba(255, 255, 255, 0.06);
          transform: translateY(-1px);
        }
        @keyframes rise {
          from {
            opacity: 0;
            transform: translateY(14px);
            filter: blur(5px);
          }
        }
        .chk {
          width: 24px;
          height: 24px;
          border-radius: 50%;
          border: 1.8px solid var(--dim);
          flex: none;
          margin-top: 1px;
          display: grid;
          place-items: center;
        }
        .chk:hover {
          border-color: var(--acc);
          box-shadow: 0 0 0 5px rgba(var(--ar), 0.12);
        }
        .task.done .chk {
          background: var(--acc);
          border-color: var(--acc);
          animation: pp2 0.45s cubic-bezier(0.3, 1.8, 0.5, 1);
        }
        @keyframes pp2 {
          from {
            transform: scale(0.6);
          }
        }
        .task.done .tt {
          color: var(--dim);
          text-decoration: line-through;
        }
        .tt {
          font-weight: 600;
          font-size: 15px;
          display: flex;
          gap: 10px;
          align-items: center;
          flex-wrap: wrap;
        }
        .tag {
          font-size: 11px;
          padding: 2px 11px;
          border-radius: 999px;
          font-weight: 600;
        }
        .due {
          font-size: 12px;
          color: var(--dim);
          margin-top: 3px;
        }
        .due.late {
          color: #ff453a;
        }
        .del {
          margin-left: auto;
          opacity: 0;
          color: var(--dim);
          padding: 2px 8px;
        }
        .task:hover .del {
          opacity: 1;
        }
        .task.out {
          animation: tout 0.32s ease forwards;
          overflow: hidden;
        }
        @keyframes tout {
          from {
            max-height: 6rem;
          }
          to {
            max-height: 0;
            opacity: 0;
            padding-top: 0;
            padding-bottom: 0;
            margin-bottom: 0;
          }
        }
        .empty {
          color: var(--dim);
          padding: 40px 0;
          text-align: center;
          max-width: 780px;
        }
        .clr {
          margin-top: 6px;
          color: var(--mut);
          font-weight: 600;
          font-size: 13px;
          padding: 8px 4px;
        }
        .clr:hover {
          color: var(--ink);
        }
        .clr[hidden] {
          display: none;
        }
        /* timer card */
        .tcard {
          margin-top: 24px;
          padding: 26px;
          display: grid;
          grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
          gap: 24px;
          z-index: 5;
        }
        .tl {
          display: flex;
          flex-direction: column;
          align-items: flex-start;
          gap: 16px;
          position: relative;
        }
        .modes {
          display: flex;
          padding: 4px;
          border-radius: 999px;
          background: rgba(0, 0, 0, 0.4);
          border: 1px solid var(--line);
        }
        .modes button {
          position: relative;
          isolation: isolate;
          padding: 8px 20px;
          border-radius: 999px;
          color: var(--mut);
          font-weight: 600;
          font-size: 13px;
        }
        .modes button.on {
          color: var(--ink);
          background: rgba(255, 255, 255, 0.1);
          text-shadow: 0 0 14px rgba(var(--ar), 0.9);
        }
        .modes button.on::before {
          content: "";
          position: absolute;
          inset: -6px;
          border-radius: 999px;
          background: radial-gradient(
            closest-side,
            rgba(var(--ar), 0.35),
            transparent
          );
          z-index: -1;
          filter: blur(4px);
        }
        .tbox {
          width: 100%;
          border: 3px solid var(--acc);
          border-radius: 32px;
          padding: 20px 16px 18px;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 9px;
          background: rgba(0, 0, 0, 0.3);
          box-shadow:
            0 0 34px -10px rgba(var(--ar), 0.55),
            inset 0 0 40px -20px rgba(var(--ar), 0.4);
          transition: box-shadow 0.5s;
        }
        .time {
          font-size: clamp(40px, 5.2vw, 58px);
          font-weight: 700;
          letter-spacing: -0.035em;
          font-variant-numeric: tabular-nums;
          line-height: 1;
        }
        .state {
          font-size: 10.5px;
          letter-spacing: 0.18em;
          font-weight: 700;
          color: var(--acc);
          padding: 5px 14px;
          border-radius: 999px;
          background: rgba(var(--ar), 0.1);
          border: 1px solid rgba(var(--ar), 0.25);
          text-transform: uppercase;
        }
        .pbar {
          width: 62%;
          height: 5px;
          border-radius: 99px;
          background: rgba(255, 255, 255, 0.08);
          overflow: hidden;
        }
        .pbar i {
          display: block;
          height: 100%;
          width: 0;
          border-radius: 99px;
          background: linear-gradient(90deg, var(--acc2), var(--acc));
          box-shadow: 0 0 12px rgba(var(--ar), 0.8);
          transition: width 0.5s linear;
        }
        .ctl {
          display: flex;
          gap: 12px;
          align-items: center;
          flex-wrap: wrap;
        }
        .play {
          width: 68px;
          height: 68px;
          border-radius: 999px;
          background: linear-gradient(135deg, var(--acc2), var(--acc));
          color: #1a0e04;
          display: grid;
          place-items: center;
          box-shadow:
            inset 0 2px 0 rgba(255, 255, 255, 0.4),
            0 0 24px -2px rgba(var(--ar), 0.55),
            0 12px 30px -8px rgba(var(--ar), 0.6);
        }
        .play:hover {
          box-shadow:
            inset 0 2px 0 rgba(255, 255, 255, 0.4),
            0 0 34px 0 rgba(var(--ar), 0.75),
            0 14px 34px -8px rgba(var(--ar), 0.7);
        }
        .tcard.run .play {
          animation: brth 4.2s ease-in-out infinite;
        }
        .tcard.run .tbox {
          animation: brb 4.2s ease-in-out infinite;
        }
        @keyframes brth {
          50% {
            transform: scale(1.07);
            box-shadow:
              inset 0 2px 0 rgba(255, 255, 255, 0.4),
              0 0 46px 4px rgba(var(--ar), 0.8),
              0 14px 34px -8px rgba(var(--ar), 0.7);
          }
        }
        @keyframes brb {
          50% {
            box-shadow:
              0 0 52px -4px rgba(var(--ar), 0.75),
              inset 0 0 50px -14px rgba(var(--ar), 0.55);
          }
        }
        .stop,
        .ib {
          width: 48px;
          height: 48px;
          border-radius: 999px;
          background: rgba(255, 255, 255, 0.06);
          border: 1px solid var(--line);
          display: grid;
          place-items: center;
          color: var(--mut);
        }
        .stop:disabled {
          opacity: 0.35;
          cursor: default;
        }
        .stop:not(:disabled):hover,
        .ib:hover {
          color: var(--ink);
          background: rgba(255, 255, 255, 0.1);
        }
        .ib svg {
          width: 20px;
          height: 20px;
          stroke: currentColor;
          fill: none;
          stroke-width: 1.8;
          stroke-linecap: round;
        }
        .mins {
          display: none;
          align-items: center;
          gap: 8px;
          color: var(--mut);
          font-size: 13px;
        }
        .mins.on {
          display: flex;
        }
        .mins input,
        .logpop input {
          width: 74px;
          background: rgba(255, 255, 255, 0.06);
          border: 1px solid var(--line);
          border-radius: 999px;
          padding: 9px 12px;
          color: var(--ink);
          font-weight: 600;
          outline: 0;
          text-align: center;
        }
        .mins input:focus,
        .logpop input:focus,
        .mbox input:focus {
          border-color: var(--acc);
          box-shadow: 0 0 0 4px rgba(var(--ar), 0.14);
        }
        .logpop {
          position: absolute;
          left: 0;
          bottom: -62px;
          z-index: 20;
          display: none;
          gap: 8px;
          align-items: center;
          padding: 8px;
          border-radius: 999px;
          background: rgba(36, 36, 40, 0.95);
          border: 1px solid var(--line);
          box-shadow: 0 30px 60px -10px #000;
        }
        .logpop.on {
          display: flex;
          animation: popin 0.3s cubic-bezier(0.2, 1.2, 0.4, 1);
        }
        .logpop #lgD {
          width: 140px;
          color-scheme: dark;
        }
        .logpop #lgA {
          padding: 9px 20px;
          border-radius: 999px;
          background: var(--ink);
          color: #000;
          font-weight: 700;
        }
        .lglist {
          position: absolute;
          left: 0;
          top: calc(100% + 70px);
          z-index: 20;
          display: none;
          flex-direction: column;
          gap: 4px;
          width: min(360px, 100%);
          max-height: 210px;
          overflow: auto;
          padding: 8px;
          border-radius: 20px;
          background: rgba(36, 36, 40, 0.95);
          border: 1px solid var(--line);
          box-shadow: 0 30px 60px -10px #000;
        }
        .lglist.on {
          display: flex;
        }
        .lglist::-webkit-scrollbar {
          width: 0;
        }
        .lglist .lgh {
          font-size: 10px;
          letter-spacing: 0.16em;
          font-weight: 800;
          color: var(--dim);
          padding: 4px 8px 2px;
        }
        .lglist .lgr {
          display: flex;
          align-items: center;
          gap: 10px;
          padding: 6px 8px;
          border-radius: 12px;
          font-size: 13px;
          font-weight: 600;
          color: var(--ink);
        }
        .lglist .lgr span {
          color: var(--mut);
          font-weight: 600;
        }
        .lglist .lgr .dot {
          width: 8px;
          height: 8px;
          border-radius: 50%;
          flex: none;
        }
        .lglist .lgr button {
          margin-left: auto;
          padding: 4px 10px;
          border-radius: 999px;
          color: var(--dim);
          font-weight: 700;
          font-size: 12px;
          border: 1px solid var(--line);
        }
        .lglist .lgr button:hover,
        .lglist .lgr button:focus-visible {
          color: #ff453a;
          border-color: #ff453a;
          outline: 0;
        }
        .tr {
          display: flex;
          flex-direction: column;
          gap: 14px;
        }
        .sp {
          padding: 16px 18px;
          border-radius: 26px;
          background: rgba(255, 255, 255, 0.035);
          border: 1px solid var(--line);
        }
        .chips {
          display: flex;
          flex-wrap: wrap;
          gap: 8px;
        }
        .chip {
          display: flex;
          align-items: center;
          gap: 8px;
          padding: 8px 15px;
          border-radius: 999px;
          background: rgba(255, 255, 255, 0.05);
          color: var(--mut);
          font-weight: 600;
          font-size: 13px;
          border: 1px solid transparent;
        }
        .chip:hover {
          color: var(--ink);
          background: rgba(255, 255, 255, 0.09);
        }
        .chip.on {
          background: var(--ink);
          color: #000;
          box-shadow: 0 0 22px -4px rgba(255, 255, 255, 0.4);
        }
        .dd {
          position: relative;
        }
        .ddb {
          width: 100%;
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 10px;
          padding: 12px 18px;
          border-radius: 999px;
          background: rgba(255, 255, 255, 0.06);
          border: 1px solid var(--line);
          font-weight: 600;
          font-size: 14px;
          text-align: left;
        }
        .ddb:hover {
          background: rgba(255, 255, 255, 0.1);
        }
        .ddb span {
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
        }
        .ddb svg {
          flex: none;
          color: var(--mut);
          transition: transform 0.3s;
        }
        .dd.open .ddb svg {
          transform: rotate(180deg);
        }
        .dd.sm .ddb {
          width: auto;
          padding: 8px 14px;
          font-size: 12px;
        }
        .dd.sm .pop {
          left: auto;
          right: 0;
        }
        .dpop {
          left: 0;
          right: 0;
          min-width: 0;
        }
        /* stats */
        .stats {
          display: grid;
          grid-template-columns: repeat(5, 1fr);
          gap: 14px;
          margin-top: 18px;
        }
        .stat {
          padding: 18px 12px;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 7px;
          text-align: center;
          border-radius: 26px;
        }
        .stat svg {
          width: 22px;
          height: 22px;
          stroke-width: 1.8;
          fill: none;
          stroke: currentColor;
          stroke-linecap: round;
          stroke-linejoin: round;
        }
        .stat small {
          font-size: 10px;
          letter-spacing: 0.14em;
          color: var(--mut);
          font-weight: 700;
        }
        .stat b {
          font-size: 25px;
          font-weight: 700;
          letter-spacing: -0.03em;
        }
        .stat b em {
          font-size: 12px;
          color: var(--mut);
          font-style: normal;
          font-weight: 600;
          margin-left: 4px;
        }
        /* trends */
        .plot {
          position: relative;
          height: 250px;
          margin: 6px 0 34px 46px;
        }
        .yax {
          position: absolute;
          inset: 0;
        }
        .yl {
          position: absolute;
          left: -46px;
          right: 0;
          border-top: 1px solid rgba(255, 255, 255, 0.06);
          font-size: 11px;
          font-weight: 600;
          color: var(--dim);
        }
        .yl span {
          position: absolute;
          top: -8px;
          left: 0;
          width: 38px;
          text-align: right;
        }
        .cols {
          position: absolute;
          inset: 0;
          display: flex;
          gap: 12px;
        }
        .col {
          flex: 1;
          position: relative;
          display: flex;
          align-items: flex-end;
          justify-content: center;
          cursor: default;
        }
        .bar {
          width: min(58px, 64%);
          display: flex;
          flex-direction: column-reverse;
          border-radius: 14px 14px 5px 5px;
          overflow: hidden;
          height: 0;
          transition: height 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .bar i {
          flex: 0 1 0px;
          min-height: 0;
          transition: flex-grow 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .col:hover .bar {
          filter: brightness(1.18);
        }
        .dl {
          position: absolute;
          left: 0;
          right: 0;
          top: calc(100% + 10px);
          font-size: 11px;
          font-weight: 700;
          color: var(--dim);
          text-align: center;
          line-height: 1.25;
        }
        .dl small {
          display: block;
          font-weight: 600;
          opacity: 0.7;
        }
        .col.now .dl {
          color: var(--acc2);
        }
        .tip {
          position: absolute;
          z-index: 12;
          pointer-events: none;
          min-width: 150px;
          padding: 11px 14px;
          border-radius: 20px;
          background: rgba(40, 40, 44, 0.96);
          border: 1px solid var(--line);
          box-shadow: 0 20px 40px -10px #000;
          font-size: 12px;
          opacity: 0;
          transform: translateY(6px);
          transition:
            opacity 0.2s,
            transform 0.2s;
        }
        .tip.on {
          opacity: 1;
          transform: none;
        }
        .tip b {
          display: block;
          font-size: 13px;
          margin-bottom: 6px;
        }
        .tip div {
          display: flex;
          align-items: center;
          gap: 7px;
          color: var(--mut);
          padding: 1px 0;
        }
        .tip div em {
          margin-left: auto;
          font-style: normal;
          color: var(--ink);
          font-weight: 700;
          padding-left: 10px;
        }
        .lgd {
          display: flex;
          flex-wrap: wrap;
          gap: 8px;
        }
        .lgd.c {
          justify-content: center;
          margin-top: 16px;
        }
        .lg1 {
          display: flex;
          align-items: center;
          gap: 8px;
          padding: 7px 14px;
          border-radius: 999px;
          background: rgba(255, 255, 255, 0.05);
          border: 1px solid var(--line);
          font-size: 12px;
          font-weight: 600;
          color: var(--ink);
        }
        .lg1 em {
          font-style: normal;
          color: var(--mut);
        }
        .lg1:hover {
          background: rgba(255, 255, 255, 0.1);
        }
        .lg1.off {
          color: var(--dim);
          text-decoration: line-through;
          background: transparent;
        }
        .lg1.off .dot {
          opacity: 0.35;
        }
        .low {
          display: grid;
          grid-template-columns: 1.5fr 1fr;
          gap: 18px;
        }
        /* heatmap */
        .cal {
          display: grid;
          grid-template-columns: repeat(7, 1fr);
          gap: 7px;
        }
        .dw {
          text-align: center;
          font-size: 10px;
          letter-spacing: 0.14em;
          color: var(--dim);
          font-weight: 700;
          padding-bottom: 4px;
        }
        .cell {
          aspect-ratio: 1.3;
          border-radius: 18px;
          padding: 6px 9px;
          background: rgba(255, 255, 255, 0.035);
          border: 1px solid transparent;
          display: flex;
          flex-direction: column;
          justify-content: space-between;
          font-size: 10px;
          font-weight: 700;
          color: var(--dim);
          text-align: left;
          min-height: 46px;
        }
        .cell span {
          align-self: center;
          font-size: 11.5px;
          font-weight: 700;
        }
        .cell:hover {
          transform: scale(1.06);
          border-color: rgba(255, 255, 255, 0.2);
        }
        .cell.today {
          border-color: var(--acc);
          box-shadow: 0 0 0 3px rgba(var(--ar), 0.14);
        }
        .cell.has {
          color: #fff;
        }
        .blank {
          visibility: hidden;
        }
        /* donut */
        .dn {
          display: flex;
          flex-direction: column;
          align-items: center;
        }
        .ring {
          position: relative;
          width: 196px;
          height: 196px;
        }
        .ring svg {
          transform: rotate(-90deg);
          width: 100%;
          height: 100%;
        }
        .ring circle {
          fill: none;
          stroke-width: 20;
        }
        .ring circle[data-k] {
          transition:
            stroke-dasharray 0.85s cubic-bezier(0.2, 0.8, 0.2, 1),
            stroke-dashoffset 0.85s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .ring .c {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
        }
        .ring .c b {
          font-size: 24px;
          font-weight: 700;
          letter-spacing: -0.03em;
        }
        .ring .c small {
          color: var(--mut);
          font-size: 11px;
        }
        /* curve */
        .cv {
          position: relative;
          height: 230px;
        }
        .cv svg {
          width: 100%;
          height: 100%;
          overflow: visible;
          display: block;
        }
        .cvp {
          fill: none;
          stroke: var(--acc);
          stroke-width: 3;
          stroke-linecap: round;
          filter: drop-shadow(0 4px 10px rgba(var(--ar), 0.6));
        }
        .cvt {
          font-size: 11px;
          font-weight: 600;
          fill: var(--dim);
        }
        /* level + rewards */
        .lvh {
          display: flex;
          align-items: center;
          gap: 14px;
          margin-bottom: 16px;
        }
        .lvav {
          width: 58px;
          height: 58px;
          border-radius: 50%;
          display: grid;
          place-items: center;
          font-size: 28px;
          background: radial-gradient(
            circle at 30% 25%,
            rgba(var(--ar), 0.4),
            rgba(var(--ar), 0.08)
          );
          box-shadow: 0 0 30px -4px rgba(var(--ar), 0.7);
          animation: glw2 3.5s ease-in-out infinite;
        }
        @keyframes glw2 {
          50% {
            box-shadow: 0 0 46px 0 rgba(var(--ar), 0.9);
          }
        }
        .lvt {
          font-size: 22px;
          font-weight: 700;
          letter-spacing: -0.03em;
          display: block;
        }
        .lvbar {
          height: 8px;
          border-radius: 99px;
          background: rgba(255, 255, 255, 0.07);
          overflow: hidden;
        }
        .lvbar i {
          display: block;
          height: 100%;
          width: 0;
          border-radius: 99px;
          background: linear-gradient(90deg, var(--acc2), var(--acc));
          box-shadow: 0 0 14px rgba(var(--ar), 0.8);
          transition: width 1s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .lad {
          display: flex;
          flex-wrap: wrap;
          gap: 6px;
          margin-top: 14px;
        }
        .lad span {
          padding: 5px 12px;
          border-radius: 999px;
          font-size: 11px;
          font-weight: 600;
          color: var(--dim);
          border: 1px solid var(--line);
        }
        .lad .a {
          color: var(--acc2);
          border-color: rgba(var(--ar), 0.4);
          background: rgba(var(--ar), 0.1);
        }
        .lad .n {
          color: var(--ink);
        }
        .bdg {
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
          gap: 10px;
        }
        .bd {
          display: flex;
          align-items: center;
          gap: 12px;
          padding: 12px 16px;
          border-radius: 999px;
          background: rgba(255, 255, 255, 0.04);
          border: 1px solid var(--line);
          transition: all 0.3s;
        }
        .bd i {
          width: 38px;
          height: 38px;
          border-radius: 50%;
          display: grid;
          place-items: center;
          font-style: normal;
          font-size: 18px;
          background: rgba(var(--ar), 0.14);
          flex: none;
        }
        .bd b {
          display: block;
          font-size: 13px;
        }
        .bd small {
          color: var(--mut);
          font-size: 11px;
        }
        .bd.lock {
          opacity: 0.5;
        }
        .bd.lock i {
          filter: grayscale(1);
          background: rgba(255, 255, 255, 0.06);
        }
        .bd.new {
          animation: nw 1.2s ease 2;
        }
        @keyframes nw {
          50% {
            box-shadow: 0 0 0 6px rgba(var(--ar), 0.25);
          }
        }
        .thm {
          display: flex;
          flex-wrap: wrap;
          gap: 10px;
        }
        .th {
          display: flex;
          align-items: center;
          gap: 10px;
          padding: 8px 18px 8px 8px;
          border-radius: 999px;
          background: rgba(255, 255, 255, 0.04);
          border: 1px solid var(--line);
          font-weight: 600;
          font-size: 13px;
        }
        .th span {
          text-align: left;
        }
        .th i {
          width: 30px;
          height: 30px;
          border-radius: 50%;
          flex: none;
        }
        .th small {
          display: block;
          font-size: 10.5px;
          color: var(--dim);
        }
        .th:hover {
          background: rgba(255, 255, 255, 0.08);
        }
        .th.on {
          border-color: var(--acc);
          box-shadow: 0 0 22px -6px rgba(var(--ar), 0.8);
        }
        .th.lock {
          opacity: 0.55;
        }
        /* modal, toast, fx */
        .x {
          position: fixed;
          top: 18px;
          right: 20px;
          width: 46px;
          height: 46px;
          border-radius: 50%;
          background: rgba(255, 255, 255, 0.07);
          border: 1px solid var(--line);
          display: grid;
          place-items: center;
          color: var(--mut);
          z-index: 25;
        }
        .x:hover {
          transform: rotate(90deg);
          color: var(--ink);
        }
        .modal {
          position: fixed;
          inset: 0;
          z-index: 30;
          display: grid;
          place-items: center;
          background: rgba(0, 0, 0, 0.55);
          -webkit-backdrop-filter: blur(12px);
          backdrop-filter: blur(12px);
          opacity: 0;
          pointer-events: none;
          transition: opacity 0.35s;
        }
        .modal.on {
          opacity: 1;
          pointer-events: auto;
        }
        .mbox {
          width: min(420px, 92vw);
          padding: 28px;
          transform: scale(0.9) translateY(20px);
          transition: transform 0.45s cubic-bezier(0.2, 1.3, 0.4, 1);
          background: #1c1c1e;
        }
        .modal.on .mbox {
          transform: none;
        }
        .mbox:hover {
          transform: none;
        }
        .mbox h2 {
          font-size: 22px;
          font-weight: 700;
          margin-bottom: 18px;
        }
        .mbox input {
          width: 100%;
          background: rgba(0, 0, 0, 0.5);
          border: 1.5px solid var(--line);
          border-radius: 999px;
          padding: 14px 20px;
          color: var(--ink);
          font-weight: 600;
          font-size: 15px;
          outline: 0;
          transition: 0.25s;
        }
        .mb {
          display: flex;
          justify-content: flex-end;
          gap: 10px;
          margin: 14px 0 22px;
        }
        .mb button {
          padding: 11px 26px;
          border-radius: 999px;
          font-weight: 700;
          color: var(--mut);
        }
        .mb #mAdd {
          background: var(--ink);
          color: #000;
        }
        .ml {
          font-size: 10.5px;
          letter-spacing: 0.18em;
          color: var(--dim);
          font-weight: 700;
          margin-bottom: 12px;
        }
        .mlist {
          max-height: 240px;
          overflow: auto;
          display: flex;
          flex-direction: column;
          gap: 9px;
        }
        .mlist::-webkit-scrollbar {
          width: 0;
        }
        .mr {
          display: flex;
          align-items: center;
          gap: 12px;
          padding: 14px 20px;
          border-radius: 999px;
          background: rgba(255, 255, 255, 0.04);
          border: 1px solid var(--line);
          font-weight: 600;
          animation: rise 0.4s both;
        }
        .mr button {
          margin-left: auto;
          color: var(--dim);
        }
        .mr button:hover {
          color: #ff453a;
        }
        .toast {
          position: fixed;
          bottom: 26px;
          left: 50%;
          transform: translateX(-50%) translateY(30px);
          opacity: 0;
          background: rgba(44, 44, 48, 0.96);
          border: 1px solid var(--line);
          padding: 11px 22px;
          border-radius: 999px;
          font-size: 13px;
          font-weight: 600;
          transition: 0.35s;
          z-index: 40;
          pointer-events: none;
          white-space: nowrap;
        }
        .toast.on {
          opacity: 1;
          transform: translateX(-50%);
        }
        .cf {
          position: fixed;
          inset: 0;
          width: 100%;
          height: 100%;
          pointer-events: none;
          z-index: 50;
        }
        .lvl {
          position: fixed;
          inset: 0;
          z-index: 45;
          display: grid;
          place-items: center;
          background: radial-gradient(
            closest-side,
            rgba(var(--ar), 0.28),
            rgba(0, 0, 0, 0.75)
          );
          opacity: 0;
          pointer-events: none;
          transition: opacity 0.5s;
        }
        .lvl.on {
          opacity: 1;
          pointer-events: auto;
        }
        .lvi {
          text-align: center;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 8px;
          transform: scale(0.7);
          transition: transform 0.7s cubic-bezier(0.2, 1.4, 0.4, 1);
        }
        .lvl.on .lvi {
          transform: none;
        }
        .lvi small {
          letter-spacing: 0.4em;
          font-size: 12px;
